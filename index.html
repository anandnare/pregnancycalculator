<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregnancy Due Date Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="theme-toggle-container">
            <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">
                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
            </button>
        </div>

        <header>
            <h1>Pregnancy Calculator</h1>
            <p class="subtitle">Calculate your estimated due date and track your progress</p>
        </header>

        <form id="pregnancyForm">
            <div class="form-group">
                <label for="lmpDate">First Day of Last Menstrual Period:</label>
                <input type="date" id="lmpDate" required>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">Calculate Due Date</button>
                <button type="reset" id="resetBtn" class="btn-secondary">Reset</button>
            </div>
        </form>

        <div id="resultsCard" class="results-card hidden">
            <div class="result-item">
                <span class="result-label">Estimated Due Date</span>
                <span id="dueDate" class="result-value">--</span>
            </div>
            
            <hr class="divider">

            <div class="result-item">
                <span class="result-label">Current Progress</span>
                <span id="gestationalAge" class="result-value">--</span>
            </div>

            <div class="progress-container">
                <div class="progress-bar-wrapper">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
                <div class="progress-labels">
                    <span>1st Tri</span>
                    <span>2nd Tri</span>
                    <span>3rd Tri</span>
                </div>
            </div>
        </div>

        <footer>
            <p class="author">Designed & Developed by <strong>Anand Nare</strong></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
